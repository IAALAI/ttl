  je_group_baf_problem: "西欧风云"
  je_baf_problem_group: "西欧风云"
  je_baf_problem_group_reason: "西方新秩序的根基已经奠定，但其结构仍然支离破碎。诸国对立依旧，而我们对尼德兰与伊比利亚遗产的掌控尚未稳固。我们必须驾驭这些内部风暴，确保帝国存续并巩固其命定霸权。"
  je_baf_lowcountries_question: "低地问题"
  je_baf_lowcountries_question_reason: "低地地区凭借其关键战略位置，长期以来一直是周边列强争夺的焦点。控制这片区域就意味着控制重要贸易航道与海岸线。我们必须解决其归属争端，以巩固地区霸权并取得对该地的永久宣称。"
  je_baf_iberian_question: "伊比利亚问题"
  je_baf_iberian_question_reason: "伊比利亚半岛的归属问题始终是我们面临的重大挑战。该地区资源丰富、战略位置关键，长期成为诸方势力角逐的核心。我们必须决定如何处理这一复杂局势，以最大化自身利益，并在未来巩固对该地区的统治。"
  je_group_baf_conquer: "西欧征服"
  je_baf_conquer_group: "西欧征服"
  je_baf_conquer_group_reason: "西欧诸强已挣脱旧日桎梏，准备夺回其作为全球裁决者的应有地位。世界将见证一个全新统一霸权的黎明。"
  je_baf_conquer_advance: "征服进度 +1"
  je_baf_conquer_central_europe: "重组邦联"
  je_baf_conquer_central_europe_reason: "为了确保大陆腹地的长期稳定，我们必须拆解旧有对立，在我方引导下建立莱茵邦联与多瑙邦联。"
  je_baf_conquer_north_america: "整合北美"
  je_baf_conquer_north_america_reason: "我们黄金时代最伟大的遗产，是由我等语言与文化塑造的世界。我们不会再容忍旧殖民地的忘恩负义；它们必须重归麾下，在同一王冠与同一命运之下再度统一。"
  je_baf_conquer_south_america: "南方整顿"
  je_baf_conquer_south_america_reason: "南方共和动荡的时代必须终结。作为文明的双重守护者，我们将建立新世界秩序，确保南方大陆的财富服务于联合帝国的进步。"
  je_baf_conquer_north_africa: "沙海之主"
  je_baf_conquer_north_africa_reason: "地中海必须成为我们的内海。掌控北非，便掌控通往大陆无尽财富的门户。"
  je_baf_conquer_middle_east: "大博弈"
  je_baf_conquer_middle_east_reason: "在东方流变的沙海中，至高权力只能属于一方。我们将掌控文明十字路口，并保卫通往东方的道路。"
  je_baf_conquer_south_asia: "王冠上的明珠"
  je_baf_conquer_south_asia_reason: "印度是帝国威望的基石。我们对这片次大陆的统治必须绝对且不容置疑。"
  je_baf_conquer_southeast_asia: "群岛整合"
  je_baf_conquer_southeast_asia_reason: "东印度的荷兰遗产如今已成为帝国责任。从巽他海峡到香料群岛，我们将把这些分散的殖民据点纳入统一行政体系，以稳固全球贸易命脉。"
