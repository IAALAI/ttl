l_english:
  BAF: "Western Europe"
  BAF_ADJ: "Western European"
  dyn_c_baf: "Union of the West"
  dyn_c_baf_adjective: "Western Unionist"
  dyn_c_union_empire: "United Empire of Britain and France"
  dyn_c_union_empire_adjective: "United Empire"
  dyn_c_people_commune: "People's Commune"
  dyn_c_people_commune_adjective: "People's Commune"
  je_group_baf_problem: "West European Storms"
  je_baf_problem_group: "West European Storms"
  je_baf_problem_group_reason: "The foundations of a new Western order have been laid, but the structure remains fractured. Rivalries persist and our grasp on the Dutch and Iberian legacies is yet to be solidified. We must navigate these internal storms to ensure the Empire’s survival and secure its destined hegemony."
  je_baf_lowcountries_question: "The Low Countries Question"
  je_baf_lowcountries_question_reason: "The Low Countries, with their key strategic location, have long been a focal point of contention among neighboring powers. Controlling this region means controlling vital trade routes and coastlines. We must now resolve the ownership dispute to consolidate our regional hegemony and secure a permanent claim to the area."
  je_baf_iberian_question: "The Iberian Question"
  je_baf_iberian_question_reason: "The question of the ownership of the Iberian Peninsula has always been a major challenge we face. The region's rich resources and strategic location have made it a focal point of contention among various powers. We must decide how to handle this complex situation to maximize our interests and consolidate control over the region in the future."
  je_group_baf_conquer: "West European Conquest"
  je_baf_conquer_group: "Western Europe Conquests"
  je_baf_conquer_group_reason: "The powers of Western Europe have cast off their old constraints to claim their rightful place as the arbiters of the globe. The world shall now witness the dawn of a new, unified hegemony"
  je_baf_conquer_group_goal: "Complete all seven conquests"
  je_baf_conquer_advance: "Conquest progress +1"
  je_baf_conquer_central_europe: "Rhine and Danube"
  je_baf_conquer_central_europe_reason: "To ensure lasting stability in the heart of the continent, we must dismantle old rivalries and establish the Confederations of the Rhine and the Danube under our guidance"
  je_baf_conquer_north_america: "Return to the Anglosphere"
  je_baf_conquer_north_america_reason: "The greatest legacy of our golden age is a world shaped by our language and culture. We shall no longer endure the ingratitude of the former colonies; they must be brought back into the fold, unified under a single crown and a single destiny."
  je_baf_conquer_south_america: "The Southern Order"
  je_baf_conquer_south_america_reason: "The era of republican instability in the South must come to an end. As the twin guardians of civilization, we shall impose a New World Order, ensuring that the wealth of the Southern Continent serves the progress of the United Empire."
  je_baf_conquer_north_africa: "Masters of the Sands"
  je_baf_conquer_north_africa_reason: "The Mediterranean must become our inland sea. By securing North Africa, we control the gateway to the vast riches of the continent."
  je_baf_conquer_middle_east: "The Great Games"
  je_baf_conquer_middle_east_reason: "In the shifting sands of the Orient, only one power can remain supreme. We shall secure the crossroads of civilization and safeguard the routes to the East"
  je_baf_conquer_south_asia: "Jewel in the Crown"
  je_baf_conquer_south_asia_reason: "India is the bedrock of imperial prestige. Our dominance over the subcontinent must be absolute and unquestioned."
  je_baf_conquer_southeast_asia: "The Spice Islands"
  je_baf_conquer_southeast_asia_reason: "The Dutch heritage in the East is now the Empire's responsibility. From the Sunda Strait to the Spice Islands, we shall bring these fragmented colonial holdings under a single, unified administration to secure the lifeline of global commerce"
  button_baf_c_c_rhine_c: "Establish the Confederation of the Rhine"
  button_baf_c_c_rhine_c_desc: "Found the Confederation of the Rhine in the Rhine region and make it our puppet."
  button_baf_c_c_rhine_c_count_tt: "We or a subject control at least #v 4#! states in the Rhine"
  button_baf_c_c_rhine_e: "Expand the Confederation of the Rhine"
  button_baf_c_c_rhine_e_desc: "Fold subjects in the Rhine, and our unincorporated states there, into the Confederation."
  button_baf_c_c_danube_c: "Establish the Danube Confederation"
  button_baf_c_c_danube_c_desc: "Found the Danube Confederation in the Danube region and make it our puppet."
  button_baf_c_c_danube_c_count_tt: "We or a subject control at least #v 4#! states in the Danube"
  button_baf_c_c_danube_e: "Expand the Danube Confederation"
  button_baf_c_c_danube_e_desc: "Fold subjects in the Danube, and our unincorporated states there, into the Confederation."
  button_baf_annex_rhn: "Annex the Confederation of the Rhine"
  button_baf_annex_rhn_desc: "The Rhine and the Danube are settled. Annex the Confederation of the Rhine."
  button_baf_annex_kuk: "Annex the Danube Confederation"
  button_baf_annex_kuk_desc: "The Rhine and the Danube are settled. Annex the Danube Confederation."
  button_baf_c_na_reset_hbc: "Reorganize the Hudson's Bay Company"
  button_baf_c_na_reset_hbc_desc: "Reorganize our largest North American colony into the Hudson's Bay Company. If we have none, found it on a North American state we own."
  button_baf_c_na_expansion_hbc: "Expand the Hudson's Bay Company"
  button_baf_c_na_expansion_hbc_desc: "Fold other North American subjects, and our unincorporated states there, into the Company."
  button_baf_c_na_conquer_hbc: "Claim an Adjacent Foothold"
  button_baf_c_na_conquer_hbc_desc: "Demand one neighbouring state from a North American country that borders us or a subject."
  button_baf_c_na_recovered: "Annex North American Subjects"
  button_baf_c_na_recovered_desc: "The Anglosphere is back under the flag. Annex every non-player subject in North America."
  button_baf_india_buymore: "Buy a Princely State"
  button_baf_india_buymore_desc: "Spend bureaucracy to annex a friendly, low-liberty princely state into the East India Company. If there is no Company, annex it directly."
  button_baf_india_conquer: "Set India to War"
  button_baf_india_conquer_desc: "Spend bureaucracy to have the East India Company demand one neighbouring Indian state. If there is no Company, we open the play ourselves."
  button_baf_annex_bic: "Annex India"
  button_baf_annex_bic_desc: "The jewel is in hand. Annex the East India Company into the Empire."
  button_baf_voc_c: "Establish the East Indies"
  button_baf_voc_c_desc: "Reorganize our largest colony in the East Indies into the Dutch East Indies. If we have none, found it on an Indonesian state we own."
  button_baf_voc_e: "Expand the East Indies"
  button_baf_voc_e_desc: "Fold other Indonesian subjects, and our unincorporated states there, into the Dutch East Indies."
  button_baf_annex_southeast: "Annex the Spice Islands"
  button_baf_annex_southeast_desc: "Annex the Dutch East Indies, and every non-player subject holding Australia proper."
  baf_annex_subjects_tt: "Non-player subjects in the region will be annexed into the company or confederation."
  baf_transfer_states_tt: "Our unincorporated states in the region will be transferred."
