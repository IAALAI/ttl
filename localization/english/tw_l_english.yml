  je_group_baf_problem: "West European Storms"
  je_baf_problem_group: "West European Storms"
  je_baf_problem_group_reason: "The foundations of a new Western order have been laid, but the structure remains fractured. Rivalries persist and our grasp on the Dutch and Iberian legacies is yet to be solidified. We must navigate these internal storms to ensure the Empire’s survival and secure its destined hegemony."
  je_baf_lowcountries_question: "The Low Countries Question"
  je_baf_lowcountries_question_reason: "The Low Countries, with their key strategic location, have long been a focal point of contention among neighboring powers. Controlling this region means controlling vital trade routes and coastlines. We must now resolve the ownership dispute to consolidate our regional hegemony and secure a permanent claim to the area."
  je_baf_iberian_question: "The Iberian Question"
  je_baf_iberian_question_reason: "The question of the ownership of the Iberian Peninsula has always been a major challenge we face. The region's rich resources and strategic location have made it a focal point of contention among various powers. We must decide how to handle this complex situation to maximize our interests and consolidate control over the region in the future."
  je_group_baf_conquer: "West European Conquest"
  je_baf_conquer_group: "Western Europe Conquests"
  je_baf_conquer_group_reason: "The powers of Western Europe have cast off their old constraints to claim their rightful place as the arbiters of the globe. The world shall now witness the dawn of a new, unified hegemony"
  je_baf_conquer_central_europe: "Reorganizing the Confederation"
  je_baf_conquer_central_europe_reason: "To ensure lasting stability in the heart of the continent, we must dismantle old rivalries and establish the Confederations of the Rhine and the Danube under our guidance"
  je_baf_conquer_north_america: "Unite the Anglosphere"
  je_baf_conquer_north_america_reason: "The greatest legacy of our golden age is a world shaped by our language and culture. We shall no longer endure the ingratitude of the former colonies; they must be brought back into the fold, unified under a single crown and a single destiny."
  je_baf_conquer_south_america: "The Southern Settlement"
  je_baf_conquer_south_america_reason: "The era of republican instability in the South must come to an end. As the twin guardians of civilization, we shall impose a New World Order, ensuring that the wealth of the Southern Continent serves the progress of the United Empire."
  je_baf_conquer_north_africa: "Masters of the Sands"
  je_baf_conquer_north_africa_reason: "The Mediterranean must become our inland sea. By securing North Africa, we control the gateway to the vast riches of the continent."
  je_baf_conquer_middle_east: "The Great Games"
  je_baf_conquer_middle_east_reason: "In the shifting sands of the Orient, only one power can remain supreme. We shall secure the crossroads of civilization and safeguard the routes to the East"
  je_baf_conquer_south_asia: "Jewel in the Crown"
  je_baf_conquer_south_asia_reason: "India is the bedrock of imperial prestige. Our dominance over the subcontinent must be absolute and unquestioned."
  je_baf_conquer_southeast_asia: "The Archipelagic Consolidation"
  je_baf_conquer_southeast_asia_reason: "The Dutch heritage in the East is now the Empire's responsibility. From the Sunda Strait to the Spice Islands, we shall bring these fragmented colonial holdings under a single, unified administration to secure the lifeline of global commerce"
